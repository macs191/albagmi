name: Windows installer

on:
  push:
    tags:
      - v0.1.6

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build installer
        run: pnpm package:win
        env:
          VITE_API_BASE_URL: https://albagmi.vercel.app

      - name: Upload installer to GitHub Release
        shell: pwsh
        run: gh release upload $env:GITHUB_REF_NAME release/ServiceHub-Desktop-0.1.6-Setup.exe --repo $env:GITHUB_REPOSITORY --clobber
        env:
          GH_TOKEN: ${{ github.token }}
