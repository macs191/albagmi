name: Windows installer

on:
  push:
    tags:
      - v0.1.11

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build installer
        run: pnpm package:win
        env:
          VITE_API_BASE_URL: https://albagmi.vercel.app

      - name: Publish installer on GitHub Release
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME release/ServiceHub-Desktop-0.1.11-Setup.exe --title "Service Hub Desktop 0.1.11" --notes "إضافة المديونيات المحلية والفواتير القابلة للطباعة A4 وكتابة المبلغ بالعربية، وإزالة قسم WhatsApp من تطبيق Windows." --latest --repo $env:GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ github.token }}
