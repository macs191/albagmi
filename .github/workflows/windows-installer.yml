name: Windows installer

on:
  push:
    tags:
      - v0.1.18
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build installer
        run: pnpm package:win
        env:
          VITE_API_BASE_URL: https://albagmi.vercel.app

      - name: Publish installer on GitHub Release
        shell: pwsh
        run: |
          $installer = Get-Item "release/ServiceHub-Desktop-0.1.18-Setup.exe"
          $blockmap = Get-Item "$($installer.FullName).blockmap"
          $latest = Get-Item "release/latest.yml"
          gh release create $env:GITHUB_REF_NAME $installer.FullName $blockmap.FullName $latest.FullName --title "Service Hub Desktop 0.1.18" --notes "إضافة قسم الوثائق والأسعار في نسخة Windows: محرر عربي قريب من Word، خانات فارغة قابلة للسحب وتغيير الحجم لتعبئتها يدويًا بعد الطباعة، حفظ محلي للوثائق والأسعار، ونسخ احتياطي واستعادة مضغوطة لبيانات البرنامج المحلية. يتضمن الإصدار أيضًا إصلاحات OCR السابقة." --latest --repo $env:GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ github.token }}
