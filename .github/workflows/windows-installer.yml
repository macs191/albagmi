name: Windows installer

on:
  push:
    tags:
      - v0.1.13

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build installer
        run: pnpm package:win
        env:
          VITE_API_BASE_URL: https://albagmi.vercel.app

      - name: Publish installer on GitHub Release
        shell: pwsh
        run: |
          $installer = Get-Item "release/ServiceHub-Desktop-0.1.13-Setup.exe"
          $blockmap = Get-Item "$($installer.FullName).blockmap"
          $latest = Get-Item "release/latest.yml"
          gh release create $env:GITHUB_REF_NAME $installer.FullName $blockmap.FullName $latest.FullName --title "Service Hub Desktop 0.1.13" --notes "إضافة البحث في Google من الشاشة الرئيسية وفتحه في تبويب جديد، وتحسين OCR لبطاقات الهوية بتقوية الصورة محليًا والمحافظة على ترتيب النص وتحويل الأرقام العربية إلى الإنجليزية، وتفعيل التحديث التلقائي عبر GitHub Releases. يشمل ميزات الماسح وحفظ الصور وPDF والطباعة والمديونيات والفواتير." --latest --repo $env:GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ github.token }}
